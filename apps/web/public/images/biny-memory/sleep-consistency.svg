<svg xmlns="http://www.w3.org/2000/svg" width="760" height="782" viewBox="0 0 760 782" role="img" aria-labelledby="title desc"><title id="title">模型判断期间数据已经变了，怎么办</title><desc id="desc">Sleep 读事实 revision=5，交给模型判断期间用户改成 6，模型返回归档；直接按 ID 归档会删掉新版本。事务、owner lease 与 expectedEntries 各解决一个不同的问题。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}</style><rect width="760" height="782" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">模型判断期间，数据已经变了</text><rect x="32" y="94" width="330" height="110" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="197" y="165.2" class="main" text-anchor="middle">Sleep 读到 A</text><text x="197" y="211.2" class="body" text-anchor="middle">revision = 5</text><rect x="398" y="94" width="330" height="110" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="563" y="165.2" class="main" text-anchor="middle">模型开始判断</text><text x="563" y="211.2" class="body" text-anchor="middle">是否需要合并（数十秒）</text><path d="M362 149 H398" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="240" width="330" height="110" rx="10" fill="#fdf4e9" stroke="#cbd6dc" stroke-width="1.5"/><text x="197" y="311.2" class="main" text-anchor="middle">用户修改了 A</text><text x="197" y="357.2" class="body" text-anchor="middle">revision 变成 6</text><rect x="398" y="240" width="330" height="110" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="563" y="311.2" class="main" text-anchor="middle">模型返回「归档 A」</text><text x="563" y="357.2" class="body" text-anchor="middle">判断依据已经过期</text><path d="M362 295 H398" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="386" class="small" text-anchor="start">直接按 ID 归档 → 删掉用户刚改的新版本。事务也救不了：它管不</text><text x="32" y="420" class="small" text-anchor="start">了判断依据是否过期。</text><rect x="32" y="466" width="330" height="120" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="197" y="525.2" class="main" text-anchor="middle">SQLite 事务</text><text x="197" y="571.2" class="body" text-anchor="middle">本次提交要么整体完成要</text><text x="197" y="605.2" class="body" text-anchor="middle">么回滚</text><rect x="398" y="466" width="330" height="120" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="563" y="525.2" class="main" text-anchor="middle">expectedEntries</text><text x="563" y="571.2" class="body" text-anchor="middle">仍活动 + revision +</text><text x="563" y="605.2" class="body" text-anchor="middle">content 相同，否则拒绝</text><rect x="32" y="622" width="330" height="120" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="197" y="681.2" class="main" text-anchor="middle">owner lease</text><text x="197" y="727.2" class="body" text-anchor="middle">60 秒租约 · 15 秒续租 ·</text><text x="197" y="761.2" class="body" text-anchor="middle">失权者不得提交</text><rect x="398" y="622" width="330" height="120" rx="10" fill="#fdf4e9" stroke="#cbd6dc" stroke-width="1.5"/><text x="563" y="681.2" class="main" text-anchor="middle">TTL 事务内复查</text><text x="563" y="727.2" class="body" text-anchor="middle">访问统计变化不改</text><text x="563" y="761.2" class="body" text-anchor="middle">revision，必须重判</text>
</svg>
