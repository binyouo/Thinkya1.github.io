<svg xmlns="http://www.w3.org/2000/svg" width="760" height="928" viewBox="0 0 760 928" role="img" aria-labelledby="title desc"><title id="title">调用不同，执行约束共用</title><desc id="desc">内置工具、MCP 工具和允许的 Code Mode 子调用进入执行协调器，处理参数与目标、权限、资源调度与复核、执行和结果；状态记录贯穿过程。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}</style><rect width="760" height="928" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">调用不同，执行约束共用</text><rect x="32" y="93" width="696" height="82" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="143" class="main" text-anchor="middle">内置工具 / MCP / Code Mode 子调用</text><path d="M380 175 V214" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="226" width="696" height="578" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="269" class="main" text-anchor="middle">ToolExecutionCoordinator</text><rect x="64" y="298" width="632" height="91" rx="10" fill="#ffffff" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="337.5" class="main" text-anchor="middle">参数校验与执行准备</text><text x="380" y="371.5" class="body" text-anchor="middle">确定真实目标、风险和访问范围</text><path d="M380 389 V411" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="64" y="420" width="632" height="91" rx="10" fill="#ffffff" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="459.5" class="main" text-anchor="middle">权限判断</text><text x="380" y="493.5" class="body" text-anchor="middle">按具体操作与目标评估</text><path d="M380 511 V533" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="64" y="542" width="632" height="91" rx="10" fill="#ffffff" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="581.5" class="main" text-anchor="middle">资源调度与目标复核</text><text x="380" y="615.5" class="body" text-anchor="middle">处理访问冲突，拒绝过期目标</text><path d="M380 633 V655" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="64" y="664" width="632" height="91" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="703.5" class="main" text-anchor="middle">工具执行</text><text x="380" y="737.5" class="body" text-anchor="middle">记录副作用提交与执行结果</text><path d="M380 804 V838" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="850" width="696" height="54" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="886" class="main" text-anchor="middle">返回结果与可核查的状态</text><text x="380" y="782" class="small" text-anchor="middle">状态记录贯穿调用过程</text></svg>
