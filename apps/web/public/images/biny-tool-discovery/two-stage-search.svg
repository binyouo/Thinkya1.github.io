<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img" aria-labelledby="title desc"><title id="title">先本地检索，再让模型判断</title><desc id="desc">ToolSearch 先用本地检索按名称与描述缩小候选；候选足够明确时直接返回，模糊或低置信度时只把这批候选交给辅助模型，再由注册表核对并注入 Schema。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#343a40}</style><rect width="760" height="790" fill="#ffffff"/><text x="32.00" y="54.00" font-size="30" fill="#343a40" text-anchor="start">先本地检索，再让模型判断</text>
<rect x="32" y="92" width="696" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/>
<text x="380.00" y="132.00" font-size="25" fill="#343a40" text-anchor="middle">主模型调用 ToolSearch</text>
<text x="380.00" y="164.00" font-size="19" fill="#343a40" text-anchor="middle">用一句缺失能力描述作为查询</text>
<path d="M380 176 L380 210" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="32" y="210" width="696" height="96" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="380.00" y="252.00" font-size="25" fill="#343a40" text-anchor="middle">本地检索：名称与描述打分</text>
<text x="380.00" y="284.00" font-size="19" fill="#343a40" text-anchor="middle">取前 k 个候选，同时保留分数与词项命中</text>
<path d="M380 306 L380 352" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#arrow)"/>
<ellipse cx="380" cy="396" rx="150" ry="44" fill="#f5f4ef" stroke="#868e96" stroke-width="1.6"/>
<text x="380.00" y="404.00" font-size="20" fill="#343a40" text-anchor="middle">候选是否足够明确？</text>
<path d="M230 396 L160 396 L160 470" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="176.00" y="386.00" font-size="17" fill="#656b72" text-anchor="start">否</text>
<path d="M530 396 L600 396 L600 470" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="584.00" y="386.00" font-size="17" fill="#656b72" text-anchor="end">是</text>
<rect x="32" y="470" width="330" height="110" rx="10" fill="#fff9db" stroke="#ad7200" stroke-width="1.6"/>
<text x="197.00" y="512.00" font-size="24" fill="#343a40" text-anchor="middle">交给辅助模型</text>
<text x="197.00" y="544.00" font-size="18" fill="#343a40" text-anchor="middle">候选只有 k 个</text>
<text x="197.00" y="574.00" font-size="18" fill="#343a40" text-anchor="middle">在候选之间做语义判断</text>
<rect x="398" y="470" width="330" height="110" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="563.00" y="512.00" font-size="24" fill="#343a40" text-anchor="middle">直接返回命中工具</text>
<text x="563.00" y="544.00" font-size="18" fill="#343a40" text-anchor="middle">不额外请求模型</text>
<text x="563.00" y="574.00" font-size="18" fill="#343a40" text-anchor="middle">延迟只剩检索</text>
<path d="M197 580 L197 640" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M563 580 L563 640" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="32" y="640" width="696" height="84" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="380.00" y="682.00" font-size="25" fill="#343a40" text-anchor="middle">注入匹配工具的完整 Schema</text>
<text x="380.00" y="712.00" font-size="19" fill="#343a40" text-anchor="middle">下一模型步骤才能调用，执行仍走统一入口</text>
<text x="380.00" y="762.00" font-size="17" fill="#656b72" text-anchor="middle">本地检索负责缩小范围，模型只在候选之间判断。</text></svg>
