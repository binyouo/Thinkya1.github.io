<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
<title id="title">Prompt Cache 复用计算，信息仍在</title><desc id="desc">示例有八千 Token 稳定输入前缀和两千 Token 新内容。前缀命中缓存仍计入逻辑上下文，输出重新生成。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53677a"/></marker></defs>
<rect width="760" height="480" fill="#f8fafc"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="36" y="48" font-size="29" font-weight="700" fill="#182a3b">Prompt Cache 复用计算，信息仍在</text>
<text x="36" y="105" font-size="26" fill="#182a3b" text-anchor="start" font-weight="600">本次逻辑输入，约 10,000 Token</text>
<rect x="36" y="135" width="550" height="130" fill="#eaf3fa" stroke="#426f92" stroke-width="2"/>
<rect x="586" y="135" width="138" height="130" fill="#fff" stroke="#b5c3cf" stroke-width="2"/>
<text x="310" y="178" font-size="26" fill="#182a3b" text-anchor="middle" font-weight="600">稳定前缀 8,000 Token</text>
<text x="310" y="222" font-size="24" fill="#526574" text-anchor="middle" font-weight="400">满足条件时，复用对应计算</text>
<text x="655" y="175" font-size="24" fill="#182a3b" text-anchor="middle" font-weight="600">新增</text>
<text x="655" y="213" font-size="24" fill="#182a3b" text-anchor="middle" font-weight="400">2,000</text>
<text x="655" y="245" font-size="22" fill="#526574" text-anchor="middle" font-weight="400">Token</text>
<path d="M380 265 V314" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="320" width="688" height="80" rx="8" fill="#eaf3fa" stroke="#426f92" stroke-width="2"/>
<text x="380.0" y="368.0" font-size="25" fill="#182a3b" text-anchor="middle" font-weight="600">继续生成本次输出</text>
<text x="380" y="448" font-size="24" fill="#182a3b" text-anchor="middle" font-weight="600">命中缓存 ≠ 返回旧答案 ≠ 上下文容量增加</text>
</g></svg>