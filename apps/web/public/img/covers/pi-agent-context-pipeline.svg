<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">一次 Pi Agent 工具调用的上下文处理链路</title>
  <desc id="desc">用户输入经过系统提示词组装、模型生成工具调用、工具执行、输出截断、消息历史和上下文压缩，分支切换时进入分支摘要。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#f7f8fa"/>
  <text x="60" y="62" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1e293b">一次工具调用，经过哪些上下文关卡</text>
  <text x="60" y="96" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">每一次循环都会重新塑形信息，直到得到下一轮模型真正需要看到的内容</text>

  <g filter="url(#shadow)">
    <rect x="70" y="142" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="450" y="142" width="300" height="100" rx="16" fill="#eef5ff" stroke="#b6c9e8" stroke-width="2"/>
    <rect x="830" y="142" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="70" y="320" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="450" y="320" width="300" height="100" rx="16" fill="#fff8e8" stroke="#e8cf91" stroke-width="2"/>
    <rect x="830" y="320" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="70" y="498" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="450" y="498" width="300" height="100" rx="16" fill="#f1f8f4" stroke="#b9d7c5" stroke-width="2"/>
    <rect x="830" y="498" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="220" y="184" font-size="21" font-weight="700" fill="#1e293b">用户输入</text>
    <text x="220" y="214" font-size="15" fill="#64748b">修复 auth.ts 的 bug</text>
    <text x="600" y="184" font-size="21" font-weight="700" fill="#315b93">系统提示词组装</text>
    <text x="600" y="214" font-size="15" fill="#475569">规范、工具、Skills、cwd</text>
    <text x="980" y="184" font-size="21" font-weight="700" fill="#1e293b">LLM 返回 toolCall</text>
    <text x="980" y="214" font-size="15" fill="#64748b">read(auth.ts)</text>

    <text x="220" y="362" font-size="21" font-weight="700" fill="#1e293b">执行工具</text>
    <text x="220" y="392" font-size="15" fill="#64748b">读取文件或运行命令</text>
    <text x="600" y="362" font-size="21" font-weight="700" fill="#956c17">输出截断</text>
    <text x="600" y="392" font-size="15" fill="#795a18">read 取头部，bash 取尾部</text>
    <text x="980" y="362" font-size="21" font-weight="700" fill="#1e293b">写入消息历史</text>
    <text x="980" y="392" font-size="15" fill="#64748b">toolResult 进入 context</text>

    <text x="220" y="540" font-size="21" font-weight="700" fill="#1e293b">agent_end</text>
    <text x="220" y="570" font-size="15" fill="#64748b">本轮 Agent Loop 结束</text>
    <text x="600" y="540" font-size="21" font-weight="700" fill="#32734e">shouldCompact</text>
    <text x="600" y="570" font-size="15" fill="#475569">检查窗口是否接近上限</text>
    <text x="980" y="540" font-size="21" font-weight="700" fill="#1e293b">下一轮上下文</text>
    <text x="980" y="570" font-size="15" fill="#64748b">近期消息 + 必要摘要</text>
  </g>

  <path d="M370 192 H440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M750 192 H820" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M980 242 V300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M830 370 H760" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M450 370 H380" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M220 420 V478" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M370 548 H440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M750 548 H820" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="270" y="650" width="660" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="690" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1e293b">两个额外的历史处理点</text>
  <text x="330" y="730" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#32734e">窗口过长 → CompactionEntry → 摘要消息</text>
  <text x="330" y="766" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#6d4b9b">切换分支 → BranchSummaryEntry → 摘要消息</text>
  <path d="M600 598 V642" fill="none" stroke="#75a98a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
