<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent 上下文工程的四层防线</title>
  <desc id="desc">输入侧包含工具输出截断和系统提示词组装，历史侧包含 Compaction 和分支摘要，四层机制共同塑造送入大模型的上下文。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f7f8fa"/>
  <text x="60" y="62" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1e293b">Pi Agent 上下文工程，四层防线</text>
  <text x="60" y="96" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">单次输入先控体积，系统提示词再补语义，历史和分支最后负责长期记忆</text>

  <rect x="48" y="132" width="500" height="224" rx="18" fill="#eef5ff" stroke="#c7d8f5" stroke-width="2"/>
  <text x="76" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#315b93">输入侧，送进模型之前</text>
  <rect x="76" y="194" width="206" height="128" rx="12" fill="#ffffff" stroke="#b6c9e8"/>
  <text x="96" y="226" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1e293b">工具输出截断</text>
  <text x="96" y="254" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">2000 行 / 50KB</text>
  <text x="96" y="279" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">read 保留开头</text>
  <text x="96" y="304" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">bash 保留末尾</text>
  <rect x="306" y="194" width="214" height="128" rx="12" fill="#ffffff" stroke="#b6c9e8"/>
  <text x="326" y="226" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1e293b">系统提示词组装</text>
  <text x="326" y="254" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">全局与项目规范</text>
  <text x="326" y="279" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">Skills 只放清单</text>
  <text x="326" y="304" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">需要时再 read</text>

  <rect x="48" y="390" width="500" height="224" rx="18" fill="#f1f8f4" stroke="#c5dfd1" stroke-width="2"/>
  <text x="76" y="428" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#32734e">历史侧，长对话继续增长</text>
  <rect x="76" y="452" width="206" height="128" rx="12" fill="#ffffff" stroke="#b9d7c5"/>
  <text x="96" y="484" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1e293b">Compaction</text>
  <text x="96" y="512" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">线性对话超出阈值</text>
  <text x="96" y="537" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">旧消息变成摘要</text>
  <text x="96" y="562" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">近期消息继续保留</text>
  <rect x="306" y="452" width="214" height="128" rx="12" fill="#ffffff" stroke="#b9d7c5"/>
  <text x="326" y="484" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1e293b">分支摘要</text>
  <text x="326" y="512" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">会话树切换分支</text>
  <text x="326" y="537" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">保留旧分支的探索</text>
  <text x="326" y="562" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">避免重复走弯路</text>

  <path d="M548 244 C620 244 624 270 688 270" fill="none" stroke="#7896c4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M548 260 C620 300 624 314 688 314" fill="none" stroke="#7896c4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M548 502 C620 438 624 386 688 386" fill="none" stroke="#75a98a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M548 518 C620 480 624 430 688 430" fill="none" stroke="#75a98a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="688" y="196" width="450" height="300" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="738" y="250" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#1e293b">LLM 看到的上下文</text>
  <text x="738" y="284" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">不是所有历史的原样堆积</text>
  <rect x="738" y="316" width="350" height="34" rx="8" fill="#e7effb"/>
  <text x="758" y="339" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#315b93">有限体积</text>
  <rect x="738" y="362" width="350" height="34" rx="8" fill="#e9f5ed"/>
  <text x="758" y="385" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#32734e">高价值信息</text>
  <rect x="738" y="408" width="350" height="34" rx="8" fill="#f4f0fb"/>
  <text x="758" y="431" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#6d4b9b">清晰的语义边界</text>
  <text x="738" y="470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#475569">上下文工程的目标，是塑形</text>
</svg>
