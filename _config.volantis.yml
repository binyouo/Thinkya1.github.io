# Volantis 主题配置（只覆盖需要修改的部分，其余用主题默认值）
# 完整配置见 node_modules/hexo-theme-volantis/_config.yml
# 文档: https://volantis.js.org/

debug: false

# 顶部导航：只保留核心页面
navbar:
  visiable: auto
  logo:
    img:
    icon: fa-solid fa-feather
    title: 彬子的Blog
  menu:
    - name: 博客
      icon: fa-solid fa-rss
      url: /
    - name: 分类
      icon: fa-solid fa-folder-open
      url: categories/
    - name: 标签
      icon: fa-solid fa-tags
      url: tags/
    - name: 归档
      icon: fa-solid fa-archive
      url: archives/
    - name: 关于
      icon: fa-solid fa-info-circle
      url: about/
  search: 搜索...

# 关闭大封面（首页直接显示文章列表，朴素风格）
cover:
  display:
    home: false
    archive: false
    others: false

# 侧边栏：首页放博主卡片和分类，文章页只放目录
sidebar:
  position: right
  for:
    home: [blogger, category, tagcloud]
    index_blog: [blogger]
    index_wiki: []
    notebooks: []
    notes: []
    post: [toc]
    wiki: [toc]
    note: [toc]
    page: [toc]

# 文章页顶部的作者信息
article:
  body:
    meta_library:
      author:
        avatar: /img/qq.jpg
        name: 彬子
        url: /about/

# 评论功能关闭
comments:
  service: ''

# 页脚：只保留版权信息
site_footer:
  layout: [copyright]
  source:
  analytics:
  copyright: '[Copyright © 2024 - 2026 彬子](/)'

# 配色：去掉默认的绿色光效，改为中性灰 + 克制的蓝色链接（参考 kaiyi.cool 的朴素风格）
color_scheme:
  common:
    theme: '#5f6672'
    link: '#4a8bfd'
    button: '#5f6672'
    hover: '#4a8bfd'
    inner: '#fff'
    selection: 'alpha(#4a8bfd, 0.2)'

# 插件：关掉用不到的
plugins:
  sitesjs:
    enable: false
  friendsjs:
    enable: false
  fpostsjs:
    enable: false
  contributorsjs:
    enable: false
  pace:
    enable: false
  darkmode:
    enable: true

# 页面卡片不使用阴影及悬停浮起效果
custom_css:
  navbar:
    effect: [blur]
  sidebar:
    effect: [blur]
  body:
    effect: [blur]
