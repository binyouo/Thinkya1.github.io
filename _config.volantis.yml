# Volantis 主题配置（只覆盖需要修改的部分，其余用主题默认值）
# 完整配置见 node_modules/hexo-theme-volantis/_config.yml
# 文档: https://volantis.js.org/

debug: false

# 顶部导航：只保留核心页面
navbar:
  visiable: always
  logo:
    img:
    icon: fa-solid fa-feather
    title: 彬子的Blog
  menu:
    - name: 博客
      url: /
    - name: 分类
      url: categories/
    - name: 标签
      url: tags/
    - name: 归档
      url: archives/
    - name: 关于
      url: about/
  search: 搜索文章

# 关闭大封面（首页直接显示文章列表，朴素风格）
cover:
  display:
    home: false
    archive: false
    others: false

# 列表页保留博主个人信息，阅读页保留目录
sidebar:
  position: right
  for:
    home: [blogger]
    index_blog: [blogger]
    index_wiki: []
    notebooks: []
    notes: []
    post: [toc]
    wiki: [toc]
    note: [toc]
    page: [toc]

# 文章页顶部的作者信息
article:
  body:
    top_meta: [author, date, category]
    bottom_meta: [updated, tags]
    meta_library:
      author:
        avatar: /img/qq.jpg
        name: 彬子
        url: /about/

# 评论功能关闭
comments:
  service: ''

# 页脚：只保留版权信息
site_footer:
  layout: [copyright]
  source:
  analytics:
  copyright: '[Copyright © 2024 - 2026 彬子](/)'

# 配色：去掉默认的绿色光效，改为中性灰 + 克制的蓝色链接（参考 kaiyi.cool 的朴素风格）
color_scheme:
  common:
    theme: '#5f6672'
    link: '#4a8bfd'
    button: '#5f6672'
    hover: '#4a8bfd'
    inner: '#fff'
    selection: 'alpha(#4a8bfd, 0.2)'
  light:
    site_bg: '#fff'
    card: '#fff'
    text: '#25282c'
    p: '#25282c'
    list: '#41464d'
    meta: '#626971'
    block: '#f4f5f6'
    codeblock: '#f4f5f6'
    inlinecode: '#343a41'
  dark:
    site_bd: '#191b1e'
    site_bg: '#191b1e'
    card: '#191b1e'
    text: '#e2e4e7'
    p: '#e2e4e7'
    list: '#c5c9ce'
    meta: '#a6adb6'
    h1: '#f0f1f3'
    h2: '#f0f1f3'
    h3: '#f0f1f3'
    h4: '#e2e4e7'
    block: '#24272b'
    codeblock: '#24272b'
    inlinecode: '#e2e4e7'
    brightness: 100%

# 插件：关掉用不到的
plugins:
  sitesjs:
    enable: false
  friendsjs:
    enable: false
  fpostsjs:
    enable: false
  contributorsjs:
    enable: false
  pace:
    enable: false
  darkmode:
    enable: true
  scrollreveal:
    enable: false
  lazyload:
    enable: false

# 系统字体避免中文正文混入等宽西文；等宽字体仅用于代码
custom_css:
  max_width: 1080px
  navbar:
    effect: []
  sidebar:
    effect: []
  body:
    effect: []
    text_align:
      p: left
  gap:
    line_height: 1.85
    h2: 48px
    h3: 32px
  fontfamily:
    bodyfont:
      fontfamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
      name:
      url:
    logofont:
      fontfamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'
      name:
      url:
    codefont:
      fontfamily: '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace'
