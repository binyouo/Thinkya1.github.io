<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc"><title id="title">Sleep 的四个阶段</title><desc id="desc">Sleep 依次执行精确去重、临时事实过期、相似整理与归档清理；前一个阶段出错会阻止后续阶段，避免整理失败后仍删除恢复来源。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}</style><rect width="760" height="710" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">Sleep 的四个阶段</text><rect x="32" y="94" width="696" height="104" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="144.025" class="main" text-anchor="middle">1 · Exact Dedup</text><text x="380" y="190.025" class="body" text-anchor="middle">Unicode 规范化 · 用户空间 + 来源锚点分组 · 保留</text><text x="380" y="226.025" class="body" text-anchor="middle">survivor</text><path d="M380 198 V228" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="228" width="696" height="104" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="296.025" class="main" text-anchor="middle">2 · Expiration</text><text x="380" y="342.025" class="body" text-anchor="middle">显式 expiresAt 到期；或从未访问且超过 30 天</text><path d="M380 332 V362" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="362" width="696" height="104" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="430.025" class="main" text-anchor="middle">3 · Similarity</text><text x="380" y="476.025" class="body" text-anchor="middle">边 0.75 成簇 · 强边 0.95 直接归档 · 其余交模型</text><path d="M380 466 V496" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="496" width="696" height="104" rx="10" fill="#fdf4e9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="564.025" class="main" text-anchor="middle">4 · Archive Purge</text><text x="380" y="610.025" class="body" text-anchor="middle">永久删除归档超过 30 天的记录</text><text x="32" y="646" class="small" text-anchor="start">存储阶段出错会阻止后续阶段：前面整理失败，就不能再删恢复来</text><text x="32" y="680" class="small" text-anchor="start">源。</text>
</svg>
