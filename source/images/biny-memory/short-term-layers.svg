<svg xmlns="http://www.w3.org/2000/svg" width="760" height="624" viewBox="0 0 760 624" role="img" aria-labelledby="title desc">
<title id="title">短期工作记忆的四层</title>
<desc id="desc">会话历史与压缩解决单会话内的上下文连续性；Thread Brief 异步整理会话；项目卡保存跨会话的项目背景与当前焦点；Todo 与 TurnStore 保存任务执行状态与断点。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#5b8db8" stroke-width="1.6"/></marker></defs>
<rect width="760" height="560" fill="#0d1b2e"/>
<text x="34" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#e8f2fb">短期工作记忆的四层</text>
<rect x="34" y="90" width="692" height="96" rx="12" fill="#0d2a4a" stroke="#2f6ea8" stroke-width="1.2"/><circle cx="62" cy="120" r="13" fill="#4a9de0"/><text x="62" y="125" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0d1b2e" text-anchor="middle">1</text><text x="86" y="125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#e8f2fb">会话历史 + 压缩</text><text x="86" y="153" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#a9c8e4">单会话内。树形消息按活动分支装配；超长时换成带固定字段的摘要</text>
<path d="M380 186 V210" fill="none" stroke="#5b8db8" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="34" y="210" width="692" height="96" rx="12" fill="#0d2a4a" stroke="#2f6ea8" stroke-width="1.2"/><circle cx="62" cy="240" r="13" fill="#3f8f86"/><text x="62" y="245" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0d1b2e" text-anchor="middle">2</text><text x="86" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#e8f2fb">Thread Brief</text><text x="86" y="273" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#a9c8e4">异步整理一条会话在做什么；行动项可转成待办，主要供界面使用</text>
<path d="M380 306 V330" fill="none" stroke="#5b8db8" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="34" y="330" width="692" height="96" rx="12" fill="#0d2a4a" stroke="#2f6ea8" stroke-width="1.2"/><circle cx="62" cy="360" r="13" fill="#c39445"/><text x="62" y="365" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0d1b2e" text-anchor="middle">3</text><text x="86" y="365" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#e8f2fb">项目卡</text><text x="86" y="393" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#a9c8e4">跨会话。保存项目背景与当前焦点，新会话注入；修改需用户确认</text>
<path d="M380 426 V450" fill="none" stroke="#5b8db8" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="34" y="450" width="692" height="96" rx="12" fill="#0d2a4a" stroke="#2f6ea8" stroke-width="1.2"/><circle cx="62" cy="480" r="13" fill="#7f6fd0"/><text x="62" y="485" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0d1b2e" text-anchor="middle">4</text><text x="86" y="485" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#e8f2fb">Todo + 执行断点</text><text x="86" y="513" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#a9c8e4">任务级。清单是工作记忆；TurnStore 保存步骤与预算，支持恢复</text>
<text x="380" y="590" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#a9c8e4" text-anchor="middle">前两层管「模型知道做到哪」，后两层管「系统能否安全接着做」。</text>
</svg>