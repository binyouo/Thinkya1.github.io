<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1066" viewBox="0 0 760 1066" role="img" aria-labelledby="title desc"><title id="title">一条事实如何回到当前回合</title><desc id="desc">召回链路依次经过可选查询改写、生成 Query Embedding、向量 Top-K、范围与事实版本复核、上下文字符与 Token 预算，最后注入当前推理。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}</style><rect width="760" height="1066" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">事实召回链路</text><rect x="32" y="94" width="696" height="104" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="156" class="main" text-anchor="middle">当前用户问题</text><path d="M380 198 V228" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="228" width="696" height="104" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="296.025" class="main" text-anchor="middle">可选查询改写</text><text x="380" y="342.025" class="body" text-anchor="middle">最长 3 秒 · 128 输出 token · 失败回退原查询</text><path d="M380 332 V362" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="362" width="696" height="104" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="430.025" class="main" text-anchor="middle">生成 Query Embedding</text><text x="380" y="476.025" class="body" text-anchor="middle">本地 multilingual-e5-small，384 维</text><path d="M380 466 V496" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="496" width="696" height="96" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="560.025" class="main" text-anchor="middle">向量相似度 Top-K</text><text x="380" y="606.025" class="body" text-anchor="middle">默认 5 条 · 门槛 0.1</text><path d="M380 592 V622" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="622" width="696" height="104" rx="10" fill="#fdf4e9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="690.025" class="main" text-anchor="middle">范围与事实版本复核</text><text x="380" y="736.025" class="body" text-anchor="middle">已删除 / 已归档 / revision 变化 → 丢弃</text><path d="M380 726 V756" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="756" width="696" height="104" rx="10" fill="#fdf4e9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="824.025" class="main" text-anchor="middle">字符与 Token 预算</text><text x="380" y="870.025" class="body" text-anchor="middle">12,000 字符上限 · 保留完整条目 · 不切半条</text><path d="M380 860 V890" fill="none" stroke="#8b9ca5" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="890" width="696" height="104" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="958.025" class="main" text-anchor="middle">注入当前推理</text><text x="380" y="1004.02" class="body" text-anchor="middle">作为参考资料，不计入 canonical history</text><text x="32" y="1036" class="small" text-anchor="start">候选被丢弃后的名额不补位。</text>
</svg>
