<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title id="title">工具如何按需进入模型上下文</title><desc id="desc">工具注册表保留完整目录；回合开始时预选相关能力；模型能力不足时通过 ToolSearch 精确或语义查找，匹配工具进入下一模型步骤。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}@media(prefers-color-scheme:dark){text{fill:#e2e4e7}.small{fill:#acb3bc}rect[fill="#ffffff"]{fill:#191b1e}rect[fill="#f5f7f8"]{fill:#25292d}rect[fill="#eaf3f9"]{fill:#242e37}rect[fill="#e9f5f0"]{fill:#25312d}rect[fill="#fff3df"]{fill:#343025}rect[stroke]{stroke:#50575f}}</style><rect width="760" height="800" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">工具如何按需进入模型上下文</text><rect x="32" y="94" width="696" height="134" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="155" class="main" text-anchor="middle">完整工具目录 · ToolRegistry</text><text x="380" y="189" class="body" text-anchor="middle">内置 / MCP / Plugin / Skill / Subagent</text><path d="M380 228 V275" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="286" width="696" height="110" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="335" class="main" text-anchor="middle">回合开始：预选相关能力</text><text x="380" y="369" class="body" text-anchor="middle">当前请求 + 最近对话 + 名称与简短描述</text><path d="M380 396 V433" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="444" width="696" height="108" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="492" class="main" text-anchor="middle">当前模型可用的工具</text><text x="380" y="526" class="body" text-anchor="middle">基础能力 + 已选中的相关能力</text><path d="M194 552 V607" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><text x="212" y="586" class="small" text-anchor="start">能力不足</text><rect x="32" y="620" width="324" height="113" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="194" y="670.5" class="main" text-anchor="middle">ToolSearch</text><text x="194" y="704.5" class="body" text-anchor="middle">精确查找 / 语义选择</text><path d="M356 677 H395" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="404" y="620" width="324" height="113" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="566" y="670.5" class="main" text-anchor="middle">核对真实注册表</text><text x="566" y="704.5" class="body" text-anchor="middle">补充到下一模型步骤</text><path d="M566 620 V563" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><text x="380" y="777" class="small" text-anchor="middle">发现工具后，执行仍需经过权限判断。</text></svg>
