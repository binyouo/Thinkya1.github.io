<svg xmlns="http://www.w3.org/2000/svg" width="760" height="768" viewBox="0 0 760 768" role="img" aria-labelledby="title desc"><title id="title">定位与提交，是两层问题</title><desc id="desc">字符串替换、Hashline 和 Patch 使用不同定位协议，但文件修改都需要核对目标与版本，再提交文件并记录证据；版本变化时拒绝继续。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}@media(prefers-color-scheme:dark){text{fill:#e2e4e7}.small{fill:#acb3bc}rect[fill="#ffffff"]{fill:#191b1e}rect[fill="#f5f7f8"]{fill:#25292d}rect[fill="#eaf3f9"]{fill:#242e37}rect[fill="#e9f5f0"]{fill:#25312d}rect[fill="#fff3df"]{fill:#343025}rect[stroke]{stroke:#50575f}}</style><rect width="760" height="768" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">定位与提交，是两层问题</text><rect x="32" y="96" width="216" height="112" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="140" y="146" class="main" text-anchor="middle">字符串替换</text><text x="140" y="180" class="body" text-anchor="middle">旧文本 → 新文本</text><path d="M140 208 V247" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="272" y="96" width="216" height="112" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="146" class="main" text-anchor="middle">Hashline</text><text x="380" y="180" class="body" text-anchor="middle">行号 + 内容摘要</text><path d="M380 208 V247" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="512" y="96" width="216" height="112" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="620" y="146" class="main" text-anchor="middle">Patch</text><text x="620" y="180" class="body" text-anchor="middle">上下文与修改</text><path d="M620 208 V247" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><path d="M140 250 H620" fill="none" stroke="#8b9ca5" stroke-width="2"  /><path d="M380 250 V282" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="296" width="696" height="108" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="344" class="main" text-anchor="middle">核对目标与文件版本</text><text x="380" y="378" class="body" text-anchor="middle">快照 / 审批预览 / 路径绑定</text><path d="M224 404 V457" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><text x="242" y="438" class="small" text-anchor="start">校验通过</text><path d="M568 404 V457" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><text x="586" y="438" class="small" text-anchor="start">发现变化</text><rect x="32" y="470" width="384" height="112" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="224" y="520" class="main" text-anchor="middle">准备临时文件并提交</text><text x="224" y="554" class="body" text-anchor="middle">按创建 / 覆盖场景处理</text><rect x="448" y="470" width="280" height="112" rx="10" fill="#fff3df" stroke="#cbd6dc" stroke-width="1.5"/><text x="588" y="520" class="main" text-anchor="middle">拒绝本次写入</text><text x="588" y="554" class="body" text-anchor="middle">重新读取与准备</text><path d="M224 582 V625" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="638" width="384" height="83" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="224" y="688.5" class="main" text-anchor="middle">记录变更与提交证据</text><text x="588" y="650" class="small" text-anchor="middle">版本校验 + 原子替换</text><text x="588" y="683" class="small" text-anchor="middle">仍有外部并发竞态</text><text x="380" y="751" class="small" text-anchor="middle">概念归纳：各编辑协议的具体校验步骤不同。</text></svg>
