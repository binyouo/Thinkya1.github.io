<svg xmlns="http://www.w3.org/2000/svg" width="760" height="765" viewBox="0 0 760 765" role="img" aria-labelledby="title desc"><title id="title">断线以后，为什么不能直接重试</title><desc id="desc">请求派发后断线，远端可能已完成操作，也可能尚未完成；客户端无法仅凭连接错误判断。应记录结果未知，核查远端与日志证据后再判断是否重试。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#8b9ca5" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172a35}.title{font-size:32px;font-weight:600}.main{font-size:30px;font-weight:600}.body{font-size:27px}.small{font-size:24px;fill:#526570}@media(prefers-color-scheme:dark){text{fill:#e2e4e7}.small{fill:#acb3bc}rect[fill="#ffffff"]{fill:#191b1e}rect[fill="#f5f7f8"]{fill:#25292d}rect[fill="#eaf3f9"]{fill:#242e37}rect[fill="#e9f5f0"]{fill:#25312d}rect[fill="#fff3df"]{fill:#343025}rect[stroke]{stroke:#50575f}}</style><rect width="760" height="765" fill="#ffffff"/><text x="32" y="53" class="title" text-anchor="start">断线以后，为什么不能直接重试</text><rect x="32" y="96" width="696" height="97" rx="10" fill="#eaf3f9" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="138.5" class="main" text-anchor="middle">客户端已派发远端写入请求</text><text x="380" y="172.5" class="body" text-anchor="middle">例如：创建一个对象</text><path d="M380 193 V233" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="246" width="696" height="94" rx="10" fill="#fff3df" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="287" class="main" text-anchor="middle">收到响应前，连接断开</text><text x="380" y="321" class="body" text-anchor="middle">客户端尚未拿到最终结果</text><path d="M380 340 V376" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><path d="M380 377 H200 V407" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><path d="M380 377 H560 V407" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="420" width="336" height="106" rx="10" fill="#e9f5f0" stroke="#cbd6dc" stroke-width="1.5"/><text x="200" y="467" class="main" text-anchor="middle">远端可能已完成</text><text x="200" y="501" class="body" text-anchor="middle">对象已经创建</text><rect x="392" y="420" width="336" height="106" rx="10" fill="#f5f7f8" stroke="#cbd6dc" stroke-width="1.5"/><text x="560" y="467" class="main" text-anchor="middle">远端可能未完成</text><text x="560" y="501" class="body" text-anchor="middle">对象尚未创建</text><path d="M200 526 V563 H380" fill="none" stroke="#8b9ca5" stroke-width="2"  /><path d="M560 526 V563 H380" fill="none" stroke="#8b9ca5" stroke-width="2"  /><path d="M380 563 V597" fill="none" stroke="#8b9ca5" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="610" width="696" height="91" rx="10" fill="#fff3df" stroke="#cbd6dc" stroke-width="1.5"/><text x="380" y="649.5" class="main" text-anchor="middle">记录 unknown，先核查证据</text><text x="380" y="683.5" class="body" text-anchor="middle">操作记录 / 日志 / 远端已有对象</text><text x="380" y="746" class="small" text-anchor="middle">本地操作 ID 本身不提供远端幂等保证。</text></svg>
