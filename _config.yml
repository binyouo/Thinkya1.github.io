# Hexo 站点配置
# 文档: https://hexo.io/zh-cn/docs/configuration.html

# 站点信息
title: 彬子的Blog
subtitle: ''
description: 记录与分享
keywords:
author: 彬子
language: zh-CN
timezone: Asia/Shanghai

# 网址（保持与旧站一致，旧链接不失效）
url: https://binzi.top
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 代码高亮
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Markdown 渲染 (hexo-renderer-markdown-it)
markdown:
  preset: default
  render:
    html: true
    xhtmlOut: false
    langPrefix: 'language-'
    breaks: true
    linkify: false
    typographer: false
  enable_rules:
  disable_rules:
  plugins:
    - '@renbaoshuo/markdown-it-katex'
  anchors:
    level: 1
    collisionSuffix: ''
    permalink: false
    permalinkClass: header-anchor
    permalinkSymbol: ''

# 分页
index_generator:
  path: ''
  per_page: 10
  order_by: -date
per_page: 10
pagination_dir: page

# 分类 & 标签
default_category: uncategorized
category_map:
tag_map:

# 日期格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'

# 主题
theme: volantis

# Atom 订阅，供博客目录聚合文章使用
feed:
  type: atom
  path: atom.xml
  limit: 0
